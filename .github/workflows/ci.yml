name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# 코드 이관 전(파일 없음)에는 각 job이 "건너뜀" 메시지만 남기고 성공 처리
jobs:
  server:
    name: server · django check + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: has
        run: echo "ok=$([ -f server/requirements.txt ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - if: steps.has.outputs.ok != 'true'
        run: echo "server/ 코드 없음 - 건너뜀"
      - if: steps.has.outputs.ok == 'true'
        uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - if: steps.has.outputs.ok == 'true'
        working-directory: server
        run: |
          pip install -r requirements.txt ruff
          ruff check . --select E9,F63,F7,F82 --exclude venv
          python manage.py check
          python manage.py test --noinput

  edge:
    name: edge · syntax check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: has
        run: echo "ok=$([ -f edge/presence.py ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - if: steps.has.outputs.ok != 'true'
        run: echo "edge/ 코드 없음 - 건너뜀"
      - if: steps.has.outputs.ok == 'true'
        uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - if: steps.has.outputs.ok == 'true'
        working-directory: edge
        run: |
          pip install ruff
          ruff check presence.py changedetection.py enroll_face.py frame_logger.py gt_logger.py --select E9,F63,F7,F82
          python -m py_compile presence.py changedetection.py enroll_face.py frame_logger.py gt_logger.py detect.py
          python -m unittest tests/test_focus_tracker.py tests/test_frame_logger.py tests/test_gt_logger.py -v

  android:
    name: android · assembleDebug
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: has
        run: echo "ok=$([ -f android/gradlew ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - if: steps.has.outputs.ok != 'true'
        run: echo "android/ 코드 없음 - 건너뜀"
      - if: steps.has.outputs.ok == 'true'
        uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - if: steps.has.outputs.ok == 'true'
        uses: gradle/actions/setup-gradle@v4
      # ubuntu-latest 에 Android SDK 기본 설치 → setup-android 생략 (라이선스 오류 회피)
      - if: steps.has.outputs.ok == 'true'
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon
