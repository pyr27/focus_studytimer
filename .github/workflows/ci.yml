name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  server:
    name: server · django check + test
    runs-on: ubuntu-latest
    if: ${{ hashFiles('server/requirements.txt') != '' }}
    defaults: { run: { working-directory: server } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt ruff
      - run: ruff check . --select E9,F63,F7,F82 --exclude venv
      - run: python manage.py check
      - run: python manage.py test --noinput

  edge:
    name: edge · syntax check
    runs-on: ubuntu-latest
    if: ${{ hashFiles('edge/presence.py') != '' }}
    defaults: { run: { working-directory: edge } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install ruff
      - run: ruff check presence.py changedetection.py enroll_face.py --select E9,F63,F7,F82
      - run: python -m py_compile presence.py changedetection.py enroll_face.py detect.py

  android:
    name: android · assembleDebug
    runs-on: ubuntu-latest
    if: ${{ hashFiles('android/gradlew') != '' }}
    defaults: { run: { working-directory: android } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v4
      # ubuntu-latest 에 Android SDK 가 기본 설치되어 있어 setup-android 생략 (라이선스 오류 회피)
      - run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon
