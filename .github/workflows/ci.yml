name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  server:
    name: server · pytest + ruff
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: server } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: server/requirements.txt }
      - run: pip install -r requirements.txt ruff pytest pytest-django
      - run: ruff check . --select E9,F63,F7,F82      # 문법/정의 오류만 (기존 코드 스타일 경고는 통과)
      - run: python manage.py check
      - run: python manage.py test --noinput
        env: { DJANGO_SETTINGS_MODULE: mysite.settings }

  edge:
    name: edge · ruff + import check
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: edge } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install ruff
      - run: ruff check presence.py changedetection.py enroll_face.py --select E9,F63,F7,F82
      - run: python -m py_compile presence.py changedetection.py enroll_face.py detect.py

  android:
    name: android · assembleDebug
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: android } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon
